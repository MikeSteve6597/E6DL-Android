# 本机只有 7.8 GB 内存、日常空闲约 1.2 GB —— Gradle 默认配置会把内存吃光并卡在 compileDebugKotlin。
# 这里刻意压低堆并让 Kotlin 在 Gradle 进程内编译，避免再起一个 2 GB 的 Kotlin daemon。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 2026-11-21 实测：Gradle 曾卡在一个零字节的下载连接上（kotlin-compiler-embeddable）。
# 显式设置连接/读取超时与重试，让"半死连接"尽快失败并换一路重试，而不是无限等。
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=3
