# 2026-11-21：本机为 24 核 / 63 GB 内存的工作机，构建按"充分并行 + 大堆"配置。
# 旧机器（7.8 GB 内存）的低内存配置已移除；若换回小内存机器，把 -Xmx 降到 1536m、
# workers.max 改为 2，并注释掉 configuration-cache（Gradle 本身仍能构建，只是慢）。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=12
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx3072m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 2026-11-21 实测：Gradle 曾卡在一个零字节的下载连接上（kotlin-compiler-embeddable）。
# 显式设置连接/读取超时与重试，让"半死连接"尽快失败并换一路重试，而不是无限等。
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=3
