[versions]
# AGP 9.x：2026.11 的 androidx（Compose BOM 2026.11.01 / navigation 2.10 / adaptive 1.3）
# 要求 compileSdk 37 且 AGP ≥ 9.1.0，所以这里固定 9.5.2（当前稳定线）。
agp = "9.5.2"
kotlin = "2.3.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.11.01"
lifecycle = "2.11.1"
navigation = "2.10.2"
adaptive = "1.3.0"
window = "1.5.1"
# 关键约束：AGP 9.5.2 内置 Kotlin 编译器为 2.2，能读的最高元数据是 2.3。
# 因此依赖不能选"编译自 Kotlin 2.4"的版本（coil 3.5+/okhttp 5.4+ 都会把 kotlin-stdlib 拉到 2.4）。
# coil 3.4.0 → stdlib 2.3.10（可读）；okhttp 5.3.0 → stdlib 2.2.21。
okhttp = "5.3.0"
coil = "3.4.0"
datastore = "1.3.0"
# Media3：用于应用内播放视频。1.10.1 依赖 kotlin-stdlib 2.0.20，兼容 AGP 9.5.2 内置的 Kotlin 2.2
media3 = "1.10.1"
# Google ML Kit 设备端翻译（本地机翻）：模型按需下载；无 GMS/无网络时回退内置词典
mlkitTranslate = "17.0.3"
junit = "4.13.2"
# JVM 单元测试里 android.jar 的 org.json 是空实现，必须补一份真实实现
json = "20240303"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
androidx-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "adaptive" }
androidx-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "adaptive" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
